[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-supply-chain"
version = "1.0.0"
description = "Autonomous Software Supply-Chain Intelligence & Verified Remediation Engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "packaging>=23.0,<27.0",
    "tomli>=2.0; python_version < '3.11'",
]
[project.scripts]
aegis = "aegis.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"